# Termux Bootstrap Framework - Plugins Manifest
plugins:
  - name: zsh-autosuggestions
    type: git
    repo: "https://github.com/zsh-users/zsh-autosuggestions"
    target: "$HOME/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    enabled: true

  - name: zsh-syntax-highlighting
    type: git
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    target: "$HOME/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    enabled: true

  - name: zsh-history-substring-search
    type: git
    repo: "https://github.com/zsh-users/zsh-history-substring-search.git"
    target: "$HOME/.oh-my-zsh/custom/plugins/zsh-history-substring-search"
    enabled: true
EOF
